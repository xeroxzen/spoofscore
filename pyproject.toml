[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "spoofscore"
version = "0.1.0"
description = "Can someone send email pretending to be your domain? SPF and DMARC posture check"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Andile Mbele", email = "andilembele020@gmail.com" }]
keywords = ["dmarc", "spf", "email", "spoofing", "security"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = ["dnspython>=2.6"]

[project.urls]
Homepage = "https://github.com/xeroxzen/spoofscore"
Documentation = "https://github.com/xeroxzen/spoofscore/tree/main/docs"
Issues = "https://github.com/xeroxzen/spoofscore/issues"
Changelog = "https://github.com/xeroxzen/spoofscore/blob/main/CHANGELOG.md"

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.10", "ruff>=0.5"]

[tool.hatch.build.targets.wheel]
packages = ["src/spoofscore"]

[tool.mypy]
strict = true
warn_unreachable = true

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
spoofscore = "spoofscore.cli:main"
